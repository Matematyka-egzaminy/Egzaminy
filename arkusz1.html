<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Arkusz 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Arkusz 1</h1>
<div class="menu-buttons">
    <button class="arkusz-buttons" onclick="location.href='index.html'">Powrót</button>
</div>

<div id="test1" class="quiz-section">


    <div class="zadanie">
        <h2>Zadanie 1</h2>
        <p>\[ \mathrm{Oblicz}: 1+1= \] </p>
        <div class="odp">
            <label><input type="radio" name="zadanie1" value="correct" id="z1a"> \( 2 \)</label><br>
            <label><input type="radio" name="zadanie1" value="wrong" id="z1b"> \( 28888 \)</label><br>
            <label><input type="radio" name="zadanie1" value="wrong" id="z1c"> \( 4 \)</label><br>
            <label><input type="radio" name="zadanie1" value="wrong" id="z1d"> \( 5 \)</label>
        </div>
        <div class="button-row">
            <button type="button" onclick="checkAnswer('zadanie1', 'correct')">Sprawdź</button>
            <button type="button" class="show-solution-button">Pokaż rozwiązanie</button>
        </div>
        <p class="solution" style="display: none;">Rozwiazanie: 1+1=2.</p>
    </div>

    <div class="zadanie">
        <h2>Zadanie 2</h2>
        <p>\[ \mathrm{Oblicz}: 1+3= \] </p>
        <div class="odp">
            <label><input type="radio" name="zadanie2" value="wrong" id="z2a"> \( 2 \)</label><br>
            <label><input type="radio" name="zadanie2" value="wrong" id="z2b"> \( 28888 \)</label><br>
            <label><input type="radio" name="zadanie2" value="correct" id="z2c"> \( 4 \)</label><br>
            <label><input type="radio" name="zadanie2" value="wrong" id="z2d"> \( 5 \)</label>
        </div>
        <div class="button-row">
            <button type="button" onclick="checkAnswer('zadanie2', 'correct')">Sprawdź</button>
            <button type="button" class="show-solution-button">Pokaż rozwiązanie</button>
        </div>
        <p class="solution" style="display: none;">Rozwiazanie: 1+3=4.</p>
    </div>

    <div class="zadanie">
        <h2>Zadanie 3</h2>
        <p>Czy 5 jest liczbą parzystą?</p>
        <div class="odp">
            <label><input type="radio" name="zadanie3" value="wrong" id="z3a"> A) TAK</label><br>
            <label><input type="radio" name="zadanie3" value="correct" id="z3b"> B) NIE</label>
        </div> ponieważ:
        <div class="odp">
            <label><input type="radio" name="zadanie3-why" value="wrong" id="z3c"> 1) dzieli sie przez 2 bez reszty</label><br>
            <label><input type="radio" name="zadanie3-why" value="correct" id="z3d"> 2) nie dzieli sie przez 2 bez reszty</label><br>
            <label><input type="radio" name="zadanie3-why" value="wrong" id="z3e"> 3) jest liczbą pierwszą</label>
        </div>
        <div class="button-row">
            <button type="button" onclick="checkCompoundAnswer('zadanie3', 'correct', 'zadanie3-why', 'correct', 'z3-result')">Sprawdź</button>
            <button type="button" class="show-solution-button">Pokaż rozwiązanie</button>
        </div>
        <p id="z3-result" class="feedback"></p>
        <p class="solution" style="display: none;">Rozwiazanie: 5 nie jest liczbą parzystą, bo nie dzieli sie przez 2 bez reszty.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("#test1 .zadanie").forEach(zadanie => {
        const button = zadanie.querySelector(".show-solution-button");
        const solution = zadanie.querySelector(".solution");

        if (!button || !solution) {
            return;
        }

        button.addEventListener("click", () => {
            solution.style.display = "block";
        });
    });
});
</script>
</body>
</html>

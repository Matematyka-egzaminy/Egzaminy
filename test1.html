<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Test 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Test 1</h1>
<div class="menu-buttons">
    <button class="arkusz-buttons" onclick="location.href='index.html'">Powrót</button>
</div>

<div id="test1" class="quiz-section">


    <div class="zadanie">
        <h2>Zadanie 1</h2>
        <p>\[ \mathrm{Oblicz}: 1+1= \] </p>
        <div class="odp">
            <label><input type="radio" name="zadanie1" value="correct" id="t1z1a"> \( 2 \)</label><br>
            <label><input type="radio" name="zadanie1" value="wrong" id="t1z1b"> \( 28888 \)</label><br>
            <label><input type="radio" name="zadanie1" value="wrong" id="t1z1c"> \( 4 \)</label><br>
            <label><input type="radio" name="zadanie1" value="wrong" id="t1z1d"> \( 5 \)</label>
        </div>
    </div>
    <div class="zadanie">
        <h2>Zadanie 2</h2>
        <p>\[ \mathrm{Oblicz}: 1+3= \] </p>
        <div class="odp">
            <label><input type="radio" name="zadanie2" value="wrong" id="z2a"> \( 2 \)</label><br>
            <label><input type="radio" name="zadanie2" value="wrong" id="z2b"> \( 28888 \)</label><br>
            <label><input type="radio" name="zadanie2" value="correct" id="z2c"> \( 4 \)</label><br>
            <label><input type="radio" name="zadanie2" value="wrong" id="z2d"> \( 5 \)</label>
        </div>

    </div>
    <div class="wynik">
        <button type="button" onclick="countCorrectAnswers('test1', 'result-test1'); markAnswers('test1')">Sprawdź Test 1</button>
        <p id="result-test1"></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="script.js"></script>
<script>
function markAnswers(testId) {
    const testSection = document.getElementById(testId);
    if (!testSection) {
        return;
    }

    testSection.querySelectorAll(".answer-feedback").forEach(el => el.remove());

    testSection.querySelectorAll("input[type=\"radio\"]:checked").forEach(input => {
        const label = input.closest("label");
        if (!label) {
            return;
        }

        const feedback = document.createElement("span");
        feedback.classList.add("answer-feedback");

        if (input.value === "correct") {
            feedback.classList.add("correct");
            feedback.innerHTML = " &check;";
        } else {
            feedback.classList.add("incorrect");
            feedback.innerHTML = " &times;";
        }

        label.appendChild(feedback);
    });
}
</script>
</body>
</html>
